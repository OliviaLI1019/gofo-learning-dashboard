:root{--bg:#f4f6fa;--card:#fff;--line:#e7ebf2;--ink:#1f2937;--muted:#6b7280;

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--ink);padding:26px 22px 60px;}
.wrap{max-width:1200px;margin:0 auto;}
header{margin-bottom:20px;}
h1{font-size:23px;font-weight:700;}
.sub{color:var(--muted);font-size:13px;margin-top:6px;}
.ddlnote{margin-top:8px;font-size:12px;color:var(--blue);background:#eef3ff;border:1px solid #d5e0ff;
display:inline-block;padding:4px 11px;border-radius:18px;font-weight:600;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;}
.kpi .label{color:var(--muted);font-size:12px;}
.kpi .num{font-size:27px;font-weight:800;margin-top:5px;line-height:1;}
.kpi .note{font-size:11px;color:var(--muted);margin-top:5px;}
.kpi.blue .num{color:var(--blue);} .kpi.green .num{color:var(--green);}
.kpi.amber .num{color:var(--amber);} .kpi.red .num{color:var(--red);}
.stitle{font-size:15px;font-weight:700;margin:24px 0 12px;display:flex;align-items:center;gap:8px;}
.stitle .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);}
.alert-panel{background:var(--redbg);border:1px solid #fecaca;border-radius:16px;padding:16px 18px;}
.ahead{font-size:13px;font-weight:700;color:#b91c1c;margin-bottom:12px;}
.urg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.uc{background:#fff;border:1.5px solid #fca5a5;border-radius:13px;padding:13px 14px;
box-shadow:0 4px 14px rgba(239,68,68,.08);}
.uc.t1{border-color:#fca5a5;} .uc.t2{border-color:#fdba74;}
.uc.t3{border-color:#fcd34d;} .uc.t4{border-color:#dbe3ef;}
.un{font-size:14.5px;font-weight:800;}
.ub{font-size:11px;color:#fff;border-radius:18px;padding:2px 9px;font-weight:700;vertical-align:2px;}
.b1{background:var(--red);} .b2{background:var(--orange);} .b3{background:var(--amber);} .b4{background:#94a3b8;}
.ui{color:var(--muted);font-size:11.5px;margin-top:5px;line-height:1.5;}
.ud{font-size:11px;margin-top:4px;color:#b91c1c;font-weight:600;}
.uc.t2 .ud{color:#c2410c;} .uc.t3 .ud{color:#a16207;} .uc.t4 .ud{color:#64748b;}
.up{font-size:21px;font-weight:800;margin-top:8px;}
.bar{height:6px;background:#eef1f6;border-radius:5px;overflow:hidden;margin-top:5px;}
.bf{height:100%;border-radius:5px;}
.uh{font-size:11px;color:var(--muted);margin-top:4px;}
.empty{color:var(--muted);font-size:12px;padding:8px 2px;}
.dept-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.dc{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 18px;}
.dc.hot{border-color:#fca5a5;}
.dh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;}
.dt{font-size:15px;font-weight:700;}
.dm{color:var(--muted);font-size:11px;}
.dalate{color:var(--orange);font-weight:700;}
.drate{font-size:20px;font-weight:800;}
.db{height:7px;background:#eef1f6;border-radius:6px;margin-bottom:12px;overflow:hidden;}
.dbf{height:100%;border-radius:6px;}
.mr{padding:9px 0;border-top:1px dashed var(--line);}
.mr.t1{background:#fff7f7;border-radius:8px;padding:9px 8px;border-left:3px solid var(--red);}
.mr.t2{border-left:3px solid var(--orange);padding-left:8px;}
.mr.t3{border-left:3px solid var(--amber);padding-left:8px;}
.mt1{display:flex;align-items:baseline;gap:8px;}
.mn{font-weight:600;font-size:13.5px;}
.mpos{color:var(--muted);font-size:11.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mpct{font-weight:700;font-size:12.5px;}
.mt2{display:flex;gap:10px;align-items:center;margin:3px 0 5px;flex-wrap:wrap;}
.ms{color:#9aa3b2;font-size:10.5px;}
.badge{font-size:10.5px;border-radius:4px;padding:1px 7px;font-weight:700;}
.g1{color:#fff;background:var(--red);} .g2{color:#fff;background:var(--orange);}
.g3{color:#fff;background:var(--amber);} .g4{color:#fff;background:#94a3b8;}
.blate{color:#9a3412;background:#ffedd5;}
.done-line{margin-top:9px;padding:7px 10px;background:#f6f9f6;border-radius:8px;
color:#8a94a6;font-size:11.5px;line-height:1.7;}
footer{margin-top:28px;color:#9aa3b2;font-size:11.5px;text-align:center;line-height:1.8;}

@media(max-width:640px){.urg-grid{grid-template-columns:1fr;}}
</style>
</head>

let scope = 'prob';

function pctf(p){ return (p*100).toFixed(1)+'%'; }
function pcolor(p){ if(p>=0.999) return '#16a34a'; if(p>=0.75) return '#f59e0b'; if(p>=0.5) return '#f97316'; return '#ef4444'; }
function rateColor(r){ return r>=100 ? '#16a34a' : (r>=50 ? '#f59e0b' : '#ef4444'); }
function cur(){ return scope==='prob' ? DATA.filter(e=>e.st==='试用') : DATA.slice(); }

// 倒计时档位：仅按 DDL 天数
function tier(dd){ if(dd===null||dd===undefined) return 4; if(dd<=30) return 1; if(dd<=60) return 2; if(dd<=90) return 3; return 4; }
function ddlText(e){
  if(e.dd===null||e.dd===undefined) return '无DDL';
  if(e.dd<0) return (e.ddt==='转正'?'转正日已过':'已逾期')+Math.abs(e.dd)+'天';
  return '距'+(e.ddt==='转正'?'转正':'完成')+e.dd+'天';
}
function ucolor(t){ return t===1?'#ef4444':t===2?'#f97316':t===3?'#f59e0b':'#94a3b8'; }

function render(){
  const list = cur();
  const done = list.filter(e=>e.done);
  const todo = list.filter(e=>!e.done).sort((a,b)=>(a.dd==null?9999:a.dd)-(b.dd==null?9999:b.dd));
  const soon = todo.filter(e=>e.dd!==null&&e.dd!==undefined&&e.dd>=0&&e.dd<=90);

  document.getElementById('kpis').innerHTML = `
    <div class="kpi blue"><div class="label">${scope==='prob'?'试用期学员':'全部学员'}</div>
      <div class="num">${list.length}</div><div class="note">按部门维度统计</div></div>
    <div class="kpi green"><div class="label">已完成 100%</div>
      <div class="num">${done.length}</div><div class="note">完成率 ${(done.length/list.length*100).toFixed(0)}%</div></div>
    <div class="kpi amber"><div class="label">学习未完成</div>
      <div class="num">${todo.length}</div><div class="note">进度 &lt; 100%</div></div>
    <div class="kpi red"><div class="label">90天内${scope==='prob'?'转正':'到期'}未完成</div>
      <div class="num">${soon.length}</div><div class="note">最紧 ${todo.length?(todo[0].dd==null?'—':todo[0].dd+'天'):'—'}</div></div>`;

  document.getElementById('alert').innerHTML = todo.length ? `
    <div class="ahead">按转正日倒计时的未完成学员（共 ${todo.length} 人，越靠前越紧迫）</div>
    <div class="urg-grid">${todo.map(e=>{
      const t=tier(e.dd);
      return `<div class="uc t${t}">
        <div class="un">${e.n} <span class="ub b${t}">${ddlText(e)}</span></div>
        <div class="ui">${e.d}<br>${e.p}</div>
        <div class="ud">${e.ddt}日 ${e.ddl||'—'}</div>
        <div class="up" style="color:${pcolor(e.pr)}">${pctf(e.pr)}</div>
        <div class="bar"><div class="bf" style="width:${Math.max(e.pr*100,2)}%;background:${pcolor(e.pr)}"></div></div>
        <div class="uh">还差 ${(100-e.pr*100).toFixed(1)}%</div>
      </div>`;}).join('')}</div>` : `<div class="empty">当前范围内无未完成学员 🎉</div>`;

  const g = {};
  list.forEach(e=>{ (g[e.d] = g[e.d] || []).push(e); });
  const groups = Object.keys(g).map(k=>{
    const arr=g[k], c=arr.filter(e=>e.done).length;
    const td=arr.filter(e=>!e.done);
    const minDd = td.length ? Math.min(...td.map(e=>e.dd==null?9999:e.dd)) : 9999;
    return {k,arr,c,nc:td.length,rate:c/arr.length*100,minDd,late:arr.filter(e=>e.late).length};
  }).sort((a,b)=> b.nc-a.nc || a.minDd-b.minDd);

  document.getElementById('depts').innerHTML = groups.map(gr=>{
    const doneArr = gr.arr.filter(e=>e.done);
    const todoArr = gr.arr.filter(e=>!e.done).sort((a,b)=>(a.dd==null?9999:a.dd)-(b.dd==null?9999:b.dd));
    const dl = doneArr.length ? `<div class="done-line">✅ 已完成 ${doneArr.length} 人：${doneArr.map(e=>e.n).join('、')}</div>` : '';
    return `<div class="dc ${gr.nc?'hot':''}">
      <div class="dh"><div class="dt">${gr.k}</div>
        <div class="dm">${gr.arr.length}人 · 完成${gr.c}/${gr.arr.length}${gr.nc?` <span class="dalate" style="color:#ef4444">未完成${gr.nc}</span>`:''}${gr.late?` <span class="dalate">延期${gr.late}</span>`:''}</div>
        <div class="drate" style="color:${rateColor(gr.rate)}">${gr.rate.toFixed(0)}%</div></div>
      <div class="db"><div class="dbf" style="width:${gr.rate.toFixed(1)}%;background:${rateColor(gr.rate)}"></div></div>
      ${todoArr.map(e=>{
        const t=tier(e.dd);
        return `<div class="mr t${t}">
          <div class="mt1"><span class="mn">${e.n}</span><span class="mpos">${e.p}</span><span class="mpct">${pctf(e.pr)}</span></div>
          <div class="mt2"><span class="ms">${e.ddt}日 ${e.ddl||'—'}</span>
            <span class="badge g${t}">${ddlText(e)}</span>${e.late?`<span class="badge blate">延期</span>`:''}</div>
          <div class="bar"><div class="bf" style="width:${Math.max(e.pr*100,2)}%;background:${pcolor(e.pr)}"></div></div>
        </div>`;}).join('')}${dl}</div>`;
  }).join('');
}

function setScope(s){ scope=s; document.querySelectorAll('[data-scope]').forEach(b=>b.classList.toggle('on',b.dataset.scope===s)); render(); }
render();
</script>
</body>
</html>
