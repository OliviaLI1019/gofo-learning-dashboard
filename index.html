*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;

.wrap{max-width:1200px;margin:0 auto;}
header{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;}
h1{font-size:23px;font-weight:700;}

.cg{display:flex;align-items:center;gap:6px;}
.cg .lb{font-size:12px;color:var(--muted);}
.btn{border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px;
padding:5px 12px;border-radius:20px;cursor:pointer;font-family:inherit;transition:.15s;}
.btn:hover{border-color:#c7d0e0;}
.btn.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;}
.kpi .label{color:var(--muted);font-size:12px;}
.kpi .num{font-size:27px;font-weight:800;margin-top:5px;line-height:1;}
.kpi .note{font-size:11px;color:var(--muted);margin-top:5px;}
.kpi.blue .num{color:var(--blue);} .kpi.green .num{color:var(--green);}
.kpi.amber .num{color:var(--amber);} .kpi.red .num{color:var(--red);} .kpi.orange .num{color:var(--orange);}

.uc{background:#fff;border:1.5px solid #fca5a5;border-radius:13px;padding:13px 15px;

.uc.lv1{border-color:#fcd34d;}
.un{font-size:15px;font-weight:800;}
.ub{font-size:11px;color:#fff;background:var(--red);border-radius:18px;padding:2px 9px;font-weight:700;vertical-align:2px;}
.uc.lv2 .ub{background:var(--orange);} .uc.lv1 .ub{background:var(--amber);}
.ui{color:var(--muted);font-size:12px;margin-top:5px;}

.uc.lv2 .ud{color:#c2410c;} .uc.lv1 .ud{color:#a16207;}

.up{font-size:23px;font-weight:800;color:var(--red);}
.uc.lv2 .up{color:var(--orange);} .uc.lv1 .up{color:var(--amber);}

.empty{color:var(--muted);font-size:12px;padding:6px 2px;}
.dept-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.dc{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 18px;}
.dc.hot{border-color:#fca5a5;}

.dt{font-size:15px;font-weight:700;}
.dm{color:var(--muted);font-size:11px;}
